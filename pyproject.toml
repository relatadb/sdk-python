[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "relata-sdk"
version = "2.5.4"
description = "Python SDK for the Relata enterprise-grade data engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ZySec AI", email = "hello@zysec.ai" },
]
keywords = [
    "relata",
    "data-engine",
    "analytics",
    "ontology",
    "bi-temporal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "langgraph>=1.2",
    "grpcio>=1.60",
]
# relata_langgraph.RelataCheckpointer / AsyncRelataCheckpointer subclass
# langgraph.checkpoint.base.BaseCheckpointSaver, so unlike relata_adapters
# (which duck-types its target frameworks) it has a real import-time
# dependency on langgraph. Kept optional since most relata-sdk users don't
# use LangGraph (#2229).
langgraph = [
    "langgraph>=1.2",
]
# relata.grpc_query.GrpcQueryClient/AsyncGrpcQueryClient drive
# `RelataQuery.Execute`'s plain-gRPC unary RPC directly, unlike `pyarrow.flight`
# (used by flight.py/query_flight, which speaks Arrow Flight's own gRPC
# service and stays lazily/undeclared-optional). `grpcio` is a real,
# declared optional extra -- mirrors `langgraph` above and TypeScript's
# `@grpc/grpc-js` optional peer dependency (#4090, round 3). Most relata-sdk
# users don't need the plain gRPC query door, so it stays out of the base
# `dependencies` list. Install with `pip install relata-sdk[grpc]`.
grpc = [
    "grpcio>=1.60",
]

[project.urls]
Homepage = "https://relatadb.dev"
Documentation = "https://docs.relatadb.dev/sdk/python"
Repository = "https://github.com/relatadb/sdk-python"
Issues = "https://github.com/relatadb/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "relata",
    "relata_adapters",
    "relata_langgraph",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ANN",
]
ignore = [
    "ANN101",
    "ANN102",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
