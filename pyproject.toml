[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "relata-sdk"
version = "0.3.7"
description = "Python SDK for the Relata enterprise-grade data engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ZySec AI", email = "hello@zysec.ai" },
]
keywords = [
    "relata",
    "data-engine",
    "analytics",
    "ontology",
    "bi-temporal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://relatadb.dev"
Documentation = "https://docs.relatadb.dev/sdk/python"
Repository = "https://github.com/relatadb/sdk-python"
Issues = "https://github.com/relatadb/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "relata",
    "relata_adapters",
    "relata_langgraph",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ANN",
]
ignore = [
    "ANN101",
    "ANN102",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
