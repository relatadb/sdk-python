name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: write
      id-token: write   # OIDC Trusted Publisher — no token needed
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install hatch tomli

      - name: Bump patch version
        id: bump
        run: |
          python3 - <<'EOF'
          import tomli, urllib.request, sys, os, re

          with open("pyproject.toml", "rb") as f:
              data = tomli.load(f)

          current = data["project"]["version"]
          parts = current.split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          new_version = ".".join(parts)

          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/relata-sdk/{new_version}/json")
              print(f"Version {new_version} already on PyPI — skipping.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
              sys.exit(0)
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          # Rewrite ONLY the `version = "…"` line in [project] — a tomli_w
          # round-trip of the whole file strips every comment (observed
          # 2026-08-26: the 2.3.2 publish deleted the #2229 langgraph
          # rationale comment from sdk-python's pyproject.toml). The version
          # line is the first standalone `version = "…"` in the file, inside
          # [project]; assert exactly one match so a future pyproject
          # restructure fails loudly instead of silently bumping the wrong key.
          text = open("pyproject.toml", encoding="utf-8").read()
          new_text, n = re.subn(
              r'(?m)^version = "[^"]*"$', f'version = "{new_version}"', text, count=1,
          )
          if n != 1 or tomli.loads(new_text)["project"]["version"] != new_version:
              print("could not rewrite the [project] version line unambiguously", file=sys.stderr)
              sys.exit(1)
          with open("pyproject.toml", "w", encoding="utf-8") as f:
              f.write(new_text)

          print(f"Bumped {current} → {new_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=false\n")
          EOF

      - name: Commit version bump
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git diff --cached --quiet || git commit -m "chore: bump version [skip ci]"
          git push

      - name: Run tests
        if: steps.bump.outputs.skip != 'true'
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pytest tests/ -q --tb=short

      - name: Build
        if: steps.bump.outputs.skip != 'true'
        run: hatch build --clean

      - name: Publish
        if: steps.bump.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
